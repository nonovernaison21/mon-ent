<script>
// Filet de sécurité : si logo.svg est absent ou illisible, un logo de secours intégré prend le relais (plus de carré « ? »)
(function(){var L="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E %3Crect width='64' height='64' rx='16' fill='%230b7a75'/%3E %3Crect x='25.9' y='39.9' width='22.1' height='10.8' rx='5.4' fill='%23ffffff' fill-opacity='.85'/%3E %3Crect x='17.1' y='12.9' width='11.1' height='38.1' rx='5.5' fill='%23ffffff'/%3E %3Ccircle cx='44.9' cy='20.9' r='6.1' fill='%23ffc24d'/%3E %3C/svg%3E";window.LAPSUS_LOGO=L;document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&!t.dataset.fb&&/logo\.svg/.test(t.getAttribute('src')||'')){t.dataset.fb='1';t.src=L;}},true);})();
</script>

<style>
[hidden]{display:none!important}
body.locked .top,body.locked .shell{display:none}
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 0}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px}
.gate-brand{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--f-display);letter-spacing:-.01em;margin-bottom:6px}
.gate-brand img{display:block;width:32px;height:32px}
.gate-card .sub{margin:0 0 18px}
.gate-card .seg{display:flex;width:100%;margin:0 0 18px}
.gate-card .seg button{flex:1;padding:9px 10px}
.gate-card input{width:100%;margin-bottom:14px}
.gate-card .m{margin:-4px 0 14px}
.gate-card .btn.primary{width:100%;padding:11px 14px}
.gate-card #authMessage{color:var(--danger);min-height:1.3em;margin:12px 0 0}
.gate-card .terms{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.gate-card .terms input[type=checkbox]{width:22px;margin:0}
.gate-card .terms span{font-size:14px;line-height:1.35}
.gate-card .terms a{color:var(--accent);text-decoration:underline}
a.btn{display:inline-block;text-decoration:none}
</style>
</head>
<body class="locked">
<div id="loader" class="loader" role="status" aria-live="polite"><div class="lg"><img src="logo.svg" alt="" width="84" height="84"><div class="lsh"></div><p class="lt" id="loaderTitle">Chargement en cours…</p><p class="ls" id="loaderSub">Ton espace arrive.</p></div></div>
<div id="gate" hidden></div>
<div id="modal" class="modal-back" hidden></div>
<header class="top">
  <div class="brand"><img src="logo.svg" alt="" width="28" height="28"><span>Lapsus</span></div>
  <div class="status" id="status"></div>
  <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Changer de thème">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button>
  <button class="icon-btn" id="logoutBtn" data-act="logout" aria-label="Se déconnecter" title="Se déconnecter">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
  </button>
</header>
<div class="shell">
  <nav id="nav" aria-label="Navigation"></nav>
  <main id="main"></main>
</div>
