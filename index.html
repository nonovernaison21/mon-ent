<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b7a75">
<title>Lapsus</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lapsus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=11">
<style>
/* ---- Écran de connexion ---- */
[hidden]{display:none!important}
body.locked .top,body.locked .shell{display:none}
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 0}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px}
.gate-brand{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--f-display);letter-spacing:-.01em;margin-bottom:6px}
.gate-brand img{display:block;width:32px;height:32px}
.gate-card .sub{margin:0 0 18px}
.gate-card .seg{display:flex;width:100%;margin:0 0 18px}
.gate-card .seg button{flex:1;padding:9px 10px}
.gate-card input{width:100%;margin-bottom:14px}
.gate-card .m{margin:-4px 0 14px}
.gate-card .btn.primary{width:100%;padding:11px 14px}
.gate-card #authMessage{color:var(--danger);min-height:1.3em;margin:12px 0 0}

</style>
</head>
<body class="locked">
<div id="loader" class="loader" role="status" aria-live="polite"><div class="lg"><img src="logo.svg" alt="" width="84" height="84"><div class="lsh"></div><p class="lt" id="loaderTitle">Chargement en cours…</p><p class="ls" id="loaderSub">Ton espace arrive.</p></div></div>
<div id="gate" hidden></div>
<header class="top">
  <div class="brand"><img src="logo.svg" alt="" width="28" height="28"><span>Lapsus</span></div>
  <div class="status" id="status"></div>
  <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Changer de thème"></button>
  <button class="icon-btn" id="logoutBtn" data-act="logout" aria-label="Se déconnecter" title="Se déconnecter"></button>
</header>
<div class="shell">
  <nav id="nav" aria-label="Navigation"></nav>
  <main id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js?v=11"></script>
</body>
</html>
